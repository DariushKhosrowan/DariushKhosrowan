<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="presentation">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .run{stroke-dasharray:140 1020;animation:run 4.5s linear infinite}
    @keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-1160}}
    .node{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <line x1="20" y1="12" x2="1180" y2="12" stroke="#7dd3fc" stroke-opacity="0.14" stroke-width="2" stroke-linecap="round"/>
  <line class="run" x1="20" y1="12" x2="1180" y2="12" stroke="url(#g)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <rect class="node" x="594" y="6" width="12" height="12" rx="2" fill="#0b1220" stroke="url(#g)" stroke-width="2.5"/>
</svg>
