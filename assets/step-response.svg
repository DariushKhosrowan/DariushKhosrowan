<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="Animated control system step response">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="1" stop-color="#0d1530"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.6" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7dd3fc" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .draw{stroke-dasharray:1000;animation:draw 6s ease-in-out infinite}
    @keyframes draw{0%{stroke-dashoffset:1000}55%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
    .fade{opacity:0;animation:fade 6s ease-in-out infinite}
    @keyframes fade{0%,30%{opacity:0}45%,92%{opacity:1}100%{opacity:0}}
    .dash{stroke-dasharray:7 7;animation:dash 1.4s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-14}}
  </style>

  <rect width="1200" height="270" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="270" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="268" rx="19" fill="none" stroke="#7dd3fc" stroke-opacity="0.18"/>

  <!-- axes -->
  <g stroke="#64748b" stroke-width="1.8" fill="none">
    <line x1="90" y1="225" x2="740" y2="225"/>
    <line x1="90" y1="30" x2="90" y2="225"/>
  </g>
  <path d="M740 225l-8-4v8z" fill="#64748b"/>
  <path d="M90 30l-4 8h8z" fill="#64748b"/>
  <text x="748" y="230" class="mono" font-size="14" fill="#94a3b8">t</text>
  <text x="100" y="40" class="mono" font-size="14" fill="#94a3b8">y(t)</text>

  <!-- reference -->
  <line class="dash" x1="90" y1="90" x2="720" y2="90" stroke="#c084fc" stroke-width="2"/>
  <text x="640" y="78" class="mono" font-size="13" fill="#c084fc">r(t) reference</text>

  <!-- response -->
  <path class="draw" pathLength="1000" filter="url(#glow)"
        d="M90,225 C112,225 140,70 185,66 C218,63 228,110 262,110 C290,110 305,82 335,84 C362,86 372,93 400,92 C428,91 440,90 480,90 L720,90"
        fill="none" stroke="url(#acc)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- annotations -->
  <g class="fade">
    <circle cx="185" cy="66" r="5" fill="#22d3ee"/>
    <text x="200" y="52" class="mono" font-size="13" fill="#22d3ee">low overshoot</text>
    <text x="440" y="140" class="mono" font-size="13" fill="#94a3b8">settles with zero steady-state error</text>
  </g>

  <!-- right panel -->
  <g>
    <text x="800" y="62" class="mono" font-size="14" fill="#22d3ee" letter-spacing="3">// DESIGN GOALS</text>
    <text x="800" y="108" class="sans" font-size="30" font-weight="800" fill="url(#acc)">Stable. Fast. Safe.</text>

    <g class="mono" font-size="14" fill="#e2e8f0">
      <circle cx="806" cy="145" r="5" fill="#22d3ee"/><text x="822" y="150">Stability first</text>
      <circle cx="806" cy="175" r="5" fill="#6366f1"/><text x="822" y="180">Performance under constraints</text>
      <circle cx="806" cy="205" r="5" fill="#c084fc"/><text x="822" y="210">Safety in multi-robot teams</text>
    </g>
  </g>
</svg>
