<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Dariush Khosrowan - Electrical and Control Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#07101f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#22d3ee"/>
    </marker>
    <clipPath id="round"><rect width="1200" height="440" rx="22"/></clipPath>
  </defs>

  <style>
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .flow{stroke-dasharray:8 8;animation:flow 1.1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-16}}
    .edge{stroke-dasharray:6 7;animation:flow 1.6s linear infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
    .rise{opacity:0;animation:rise .9s ease-out forwards}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}.d4{animation-delay:1.05s}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .float{animation:float 5s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#grid)"/>
    <rect width="1200" height="440" fill="url(#glowA)"/>
    <rect width="1200" height="440" fill="url(#glowB)"/>

    <!-- top accent line -->
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

    <!-- ============ TEXT ============ -->
    <g class="rise d1">
      <text x="70" y="70" class="mono" font-size="16" fill="#22d3ee" letter-spacing="3">// ELECTRICAL &amp; CONTROL ENGINEER<tspan class="blink"> _</tspan></text>
    </g>
    <g class="rise d2">
      <text x="68" y="150" class="sans" font-size="60" font-weight="800" fill="url(#accent)" filter="url(#glow)">Dariush Khosrowan</text>
    </g>
    <g class="rise d3">
      <text x="70" y="196" class="sans" font-size="22" fill="#e2e8f0" letter-spacing="1">AI  ·  Robotics  ·  Multi-Agent Systems  ·  Research</text>
    </g>
    <g class="rise d4">
      <text x="70" y="232" class="mono" font-size="14" fill="#94a3b8">Decentralized &amp; Safe Formation Control · Differential-Drive Robots · Minimal Sensing</text>
      <text x="70" y="256" class="mono" font-size="14" fill="#64748b">Iran University of Science and Technology (IUST)</text>
    </g>

    <!-- ============ FORMATION GRAPHIC ============ -->
    <g class="float">
      <!-- edges -->
      <g stroke="#6366f1" stroke-width="2" fill="none" opacity="0.9">
        <line class="edge" x1="1010" y1="95" x2="925" y2="225"/>
        <line class="edge" x1="1010" y1="95" x2="1095" y2="225"/>
        <line class="edge" x1="925" y1="225" x2="1095" y2="225"/>
      </g>
      <!-- safety radii -->
      <g fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1.2">
        <circle cx="1010" cy="95" r="34"/>
        <circle cx="925" cy="225" r="34"/>
        <circle cx="1095" cy="225" r="34"/>
      </g>
      <!-- pulse rings -->
      <g fill="none" stroke="#22d3ee" stroke-width="2">
        <circle class="pulse" cx="1010" cy="95" r="10"/>
        <circle class="pulse" cx="925" cy="225" r="10" style="animation-delay:.8s"/>
        <circle class="pulse" cx="1095" cy="225" r="10" style="animation-delay:1.6s"/>
      </g>
      <!-- robots -->
      <g filter="url(#glow)">
        <circle cx="1010" cy="95" r="11" fill="#0b1220" stroke="#22d3ee" stroke-width="3"/>
        <circle cx="925" cy="225" r="11" fill="#0b1220" stroke="#818cf8" stroke-width="3"/>
        <circle cx="1095" cy="225" r="11" fill="#0b1220" stroke="#c084fc" stroke-width="3"/>
        <path d="M1010 83l5 8h-10z" fill="#22d3ee"/>
        <path d="M925 213l5 8h-10z" fill="#818cf8"/>
        <path d="M1095 213l5 8h-10z" fill="#c084fc"/>
      </g>
      <!-- orbit -->
      <g class="spin">
        <ellipse cx="1010" cy="170" rx="120" ry="38" fill="none" stroke="#7dd3fc" stroke-opacity="0.18" stroke-dasharray="3 9"/>
      </g>
    </g>

    <!-- ============ CONTROL LOOP ============ -->
    <g class="sans" font-size="15" fill="#e2e8f0">
      <text x="70" y="346" class="mono" fill="#7dd3fc" font-size="16">r(t)</text>
      <!-- r -> sum -->
      <line class="flow" x1="112" y1="340" x2="206" y2="340" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arr)"/>
      <!-- sum -->
      <circle cx="230" cy="340" r="22" fill="#0b1220" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow)"/>
      <text x="230" y="347" text-anchor="middle" class="mono" font-size="20" fill="#22d3ee">Σ</text>
      <text x="204" y="322" class="mono" font-size="13" fill="#94a3b8">+</text>
      <text x="214" y="378" class="mono" font-size="14" fill="#94a3b8">−</text>
      <!-- sum -> C -->
      <line class="flow" x1="252" y1="340" x2="336" y2="340" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arr)"/>
      <text x="294" y="330" text-anchor="middle" class="mono" font-size="12" fill="#94a3b8">e(t)</text>
      <!-- controller -->
      <rect x="340" y="308" width="132" height="64" rx="12" fill="#0f1a36" stroke="url(#accent)" stroke-width="2.5" filter="url(#glow)"/>
      <text x="406" y="336" text-anchor="middle" font-size="14" fill="#94a3b8">Controller</text>
      <text x="406" y="358" text-anchor="middle" class="mono" font-size="17" fill="#e2e8f0">C(s) · MPC</text>
      <!-- C -> P -->
      <line class="flow" x1="472" y1="340" x2="576" y2="340" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arr)"/>
      <text x="524" y="330" text-anchor="middle" class="mono" font-size="12" fill="#94a3b8">u(t)</text>
      <!-- plant -->
      <rect x="580" y="308" width="150" height="64" rx="12" fill="#0f1a36" stroke="url(#accent)" stroke-width="2.5" filter="url(#glow)"/>
      <text x="655" y="336" text-anchor="middle" font-size="14" fill="#94a3b8">Robot Plant</text>
      <text x="655" y="358" text-anchor="middle" class="mono" font-size="17" fill="#e2e8f0">P(s)</text>
      <!-- P -> y -->
      <line class="flow" x1="730" y1="340" x2="838" y2="340" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arr)"/>
      <text x="850" y="346" class="mono" fill="#7dd3fc" font-size="16">y(t)</text>
      <!-- feedback -->
      <path class="flow" d="M784 340 V404 H230 V364" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arr)"/>
      <circle cx="784" cy="340" r="4.5" fill="#c084fc"/>
      <text x="507" y="396" text-anchor="middle" class="mono" font-size="12" fill="#c084fc">minimal-sensing feedback</text>
    </g>

    <!-- corner chips -->
    <g class="mono" font-size="12">
      <rect x="930" y="330" width="200" height="30" rx="15" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="1030" y="350" text-anchor="middle" fill="#22d3ee">SENSE → LEARN → ADAPT</text>
      <rect x="930" y="372" width="200" height="30" rx="15" fill="#c084fc" fill-opacity="0.1" stroke="#c084fc" stroke-opacity="0.5"/>
      <text x="1030" y="392" text-anchor="middle" fill="#c084fc">SAFE · DECENTRALIZED</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="438" rx="22" fill="none" stroke="#7dd3fc" stroke-opacity="0.18"/>
</svg>
